name: python
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:
          # ubuntu-latest (26.04) ships no Python 3.9 build; test 3.9 on 22.04 instead.
          - { os: ubuntu-latest, python: "3.9" }
        include:
          - { os: ubuntu-22.04, python: "3.9" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m unittest discover -s python/tests -t python
  # The Python edition must keep giving the answers frozen in contract/golden, the same bar the Go server meets.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          python contract/serve_python.py 8199 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8199/readyz && break; sleep 0.5; done
          CONTRACT_BASE_URL=http://127.0.0.1:8199 go test ./go/internal/contract -run Golden
