name: go
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...        # includes the golden contract test (contract/golden)
  smoke:
    # Clean-machine check on each OS: build the binary, fresh HOME, fixture transcripts,
    # start the server, run setup, scan, load the UI, snapshot + export the archive.
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          BIN="$(pwd)/wmh-bin"; if [ "$RUNNER_OS" = Windows ]; then BIN="$BIN.exe"; fi
          go build -o "$BIN" ./go/cmd/watch-my-harness
          scripts/smoke.sh "$BIN"
  cross-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Dry run only: builds all 5 targets into dist/, publishes nothing.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - uses: actions/upload-artifact@v4
        with:
          name: watch-my-harness-snapshot
          path: dist/*.tar.gz
